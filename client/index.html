<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons with cache-busting version query -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2026" />
    <link rel="icon" id="dynamic-favicon" type="image/png" href="/favicon-black.png?v=2026" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-white.png?v=2026" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon-black.png?v=2026" />
    <script>
      (function() {
        try {
          var matcher = window.matchMedia('(prefers-color-scheme: dark)');
          function updateFavicon() {
            var icon = document.getElementById('dynamic-favicon');
            if (icon) {
              icon.href = (matcher.matches ? '/favicon-white.png' : '/favicon-black.png') + '?v=2026';
            }
          }
          if (matcher.addEventListener) {
            matcher.addEventListener('change', updateFavicon);
          } else if (matcher.addListener) {
            matcher.addListener(updateFavicon);
          }
          updateFavicon();
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        display: none !important;
