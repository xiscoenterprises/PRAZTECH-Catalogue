<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dynamic theme-aware favicons: White for Dark browser theme, Black for Light browser theme -->
    <link rel="icon" id="dynamic-favicon" type="image/png" href="/favicon-black.png?v=3" media="(prefers-color-scheme: light)" />
    <link rel="icon" id="dynamic-favicon-dark" type="image/png" href="/favicon-white.png?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon-black.png?v=3" />
    <script>
      (function() {
        try {
          var darkMatcher = window.matchMedia('(prefers-color-scheme: dark)');
          function applyFavicon(isDark) {
            var targetHref = (isDark ? '/favicon-white.png' : '/favicon-black.png') + '?v=3';
            var existing = document.getElementById('dynamic-favicon');
            if (existing) {
              existing.removeAttribute('media');
              existing.href = targetHref;
            } else {
              var link = document.createElement('link');
              link.id = 'dynamic-favicon';
              link.rel = 'icon';
              link.type = 'image/png';
              link.href = targetHref;
              document.head.appendChild(link);
            }
            var darkLink = document.getElementById('dynamic-favicon-dark');
            if (darkLink && darkLink.parentNode) {
              darkLink.parentNode.removeChild(darkLink);
            }
          }
          applyFavicon(darkMatcher.matches);
          if (darkMatcher.addEventListener) {
            darkMatcher.addEventListener('change', function(e) { applyFavicon(e.matches); });
          } else if (darkMatcher.addListener) {
            darkMatcher.addListener(function(e) { applyFavicon(e.matches); });
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
